# ATTENZIONE — questo flusso non parte piu' da solo.
#
# Il suo gemello per Windows produceva un pacchetto che va in crash all'avvio
# (0xC0000409), e nessuno qui puo' provare un .dmg. Si lancia a mano, e chi lo
# lancia lo prova.
name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.17.52
      arch:
        description: Architettura da costruire (all, arm64, x86_64)
        required: true
        default: x86_64
        type: choice
        options: [all, arm64, x86_64]

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch == 'arm64' && 'apple-silicon' || 'intel' }}
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-14' || 'macos-15-intel' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arch == 'all' && '["arm64", "x86_64"]' || format('["{0}"]', inputs.arch)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja qt qtkeychain openssl@3 brotli webp

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDECODXLOG_REQUIRE_OPENSSL=ON -DCMAKE_PREFIX_PATH="$(brew --prefix qt);$(brew --prefix qtkeychain)" -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DOPENSSL_USE_STATIC_LIBS=FALSE

      - name: Build
        run: cmake --build build --parallel 3 --target decolog

      - name: Release gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/release-gate.sh build build/DecoDXLog.app/Contents/MacOS/DecoDXLog

      - name: Deploy app bundle
        run: |
          export PATH="$(brew --prefix qt)/bin:$PATH"
          # Le formule Homebrew tengono WebP, Sharpyuv e Brotli fuori dal
          # prefisso Qt: dichiararle esplicitamente evita rpath irrisolti sul
          # runner Intel. La firma la facciamo dopo il deploy.
          macdeployqt build/DecoDXLog.app \
            -qmldir=qml \
            -qmldir=libs/decodium-ui/qml \
            -libpath="$(brew --prefix brotli)/lib" \
            -libpath="$(brew --prefix webp)/lib" \
            -libpath="$(brew --prefix openssl@3)/lib" \
            -no-codesign \
            -verbose=1

          # DecoDXLog writes PDFs through QtGui/QPdfWriter; it does not read
          # PDFs through QtPdf. These optional Qt plugins are not used by the
          # application and pull QtPdf, Qt3D, QtStateMachine or QtVirtualKeyboard
          # from Homebrew when probed. Keep them out instead of publishing a
          # bundle that can load a second Qt installation at runtime.
          unused_plugins="$RUNNER_TEMP/decodxlog-unused-qt-plugins"
          mkdir -p "$unused_plugins"
          while IFS= read -r -d '' plugin; do
            case "$(basename "$plugin")" in
              libqpdf.dylib|libpdfquickplugin.dylib|libqtvirtualkeyboardplugin.dylib|\
              libqtqmlstatemachineplugin.dylib|\
              libqtquickscene2dplugin.dylib|libqtquickscene3dplugin.dylib|\
              libqtquicktimeline*.dylib|libqtvkb*.dylib|libvirtualkeyboardplugin.dylib)
                mv "$plugin" "$unused_plugins/"
                ;;
            esac
          done < <(find build/DecoDXLog.app/Contents/PlugIns -type f -print0)
          for qml_dir in \
            build/DecoDXLog.app/Contents/Resources/qml/QtQml/StateMachine \
            build/DecoDXLog.app/Contents/Resources/qml/QtQuick/Pdf \
            build/DecoDXLog.app/Contents/Resources/qml/QtQuick/Scene2D \
            build/DecoDXLog.app/Contents/Resources/qml/QtQuick/Scene3D \
            build/DecoDXLog.app/Contents/Resources/qml/QtQuick/Timeline \
            build/DecoDXLog.app/Contents/Resources/qml/QtQuick/VirtualKeyboard; do
            if [[ -e "$qml_dir" || -L "$qml_dir" ]]; then
              mv "$qml_dir" "$unused_plugins/"
            fi
          done

          scripts/fix-macos-bundle.sh build/DecoDXLog.app

          for library in libcrypto libssl; do
            test -n "$(find build/DecoDXLog.app/Contents/Frameworks -maxdepth 1 -name "${library}*.dylib" -print -quit)" \
              || { echo "OpenSSL ${library} was not bundled into the app"; exit 1; }
          done

          version="${{ inputs.tag }}"
          version="${version#v}"
          mkdir -p release-assets

          # Non abbiamo un certificato Developer ID, quindi questa non rende
          # l'app notarizzata. Pero' macOS 26 rifiuta il binario linker-signed
          # lasciato da clang quando il bundle non ha il suo CodeResources:
          # una firma ad-hoc dell'intero bundle sigilla risorse e dipendenze.
          # Edicion CX8ANM: icono del cóndor para el .app
          iconset="$RUNNER_TEMP/decodxlog.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size resources/decodxlog.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size*2))
            sips -z $double $double resources/decodxlog.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          # macdeployqt deja el bundle de solo lectura: devolverle permiso de escritura.
          chmod -R u+w build/DecoDXLog.app
          plist=build/DecoDXLog.app/Contents/Info.plist
          icon_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$plist" 2>/dev/null || true)"
          [ -n "$icon_name" ] || icon_name=decodxlog.icns
          case "$icon_name" in *.icns) ;; *) icon_name="$icon_name.icns" ;; esac
          iconutil -c icns "$iconset" -o "build/DecoDXLog.app/Contents/Resources/$icon_name"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile $icon_name" "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string $icon_name" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName DecoDXLog CX8ANM" "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string DecoDXLog CX8ANM" "$plist"

          codesign --force --deep --sign - --timestamp=none build/DecoDXLog.app
          codesign --verify --deep --strict --verbose=2 build/DecoDXLog.app

          hdiutil create -volname "DecoDXLog CX8ANM $version" \
            -srcfolder build/DecoDXLog.app \
            -ov -format UDZO \
            "release-assets/DecoDXLog-$version-macos-${{ matrix.arch }}.dmg"

      - name: Smoke-test final DMG
        env:
          # macdeployqt bundles Cocoa on macOS; Qt's offscreen plugin is not
          # shipped in the final app, so use the native platform for the
          # mounted-bundle smoke test.
          QT_QPA_PLATFORM: cocoa
        run: |
          version="${{ inputs.tag }}"
          version="${version#v}"
          dmg="release-assets/DecoDXLog-$version-macos-${{ matrix.arch }}.dmg"
          mount_point="$RUNNER_TEMP/decodxlog-dmg"
          probe="$RUNNER_TEMP/decodxlog-dmg.png"
          mkdir -p "$mount_point"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true; rm -f "$probe"' EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          app="$mount_point/DecoDXLog.app/Contents/MacOS/DecoDXLog"
          test -x "$app"
          "$app" --show badge --grab "$probe"
          test -s "$probe"
          hdiutil detach "$mount_point"
          trap - EXIT

      # Edicion CX8ANM: sin firma de auto-update ni publicacion; solo artefacto privado.
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: DecoDXLog-macos-${{ matrix.arch }}
          path: release-assets/*.dmg
          if-no-files-found: error
